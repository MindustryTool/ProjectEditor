name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check circular dependencies
        run: |
          for project in apps/web packages/api packages/config packages/core packages/fs packages/hjson packages/schema packages/state packages/types packages/utils packages/zip; do
            echo "Checking $project..."
            (cd "$project" && pnpm exec depcruise src --config .dependency-cruiser.cjs)
          done
      - run: pnpm turbo run typecheck lint test
